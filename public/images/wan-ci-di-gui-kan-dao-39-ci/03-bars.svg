<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <style>
    text { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #808080; }
    .t { font-size: 18px; fill: #6f6f6f; }
    .s { font-size: 13px; }
    .lab { font-size: 15px; fill: #6f6f6f; }
    .val { font-size: 15px; fill: #6f6f6f; }
    .bar0 { fill: #bb6055; fill-opacity: .22; stroke: #bb6055; stroke-width: 1.4; }
    .bar1 { fill: #5c8fbb; fill-opacity: .28; stroke: #5c8fbb; stroke-width: 1.4; }
    .axis { stroke: #8a8a8a; stroke-width: 1; opacity: .5; }
    .tick { stroke: #8a8a8a; stroke-width: 1; opacity: .25; }
  </style>

  <text class="t" x="40" y="52">同一份输入（2 4 4 5 5 5 5 5 5 5），递归调用次数</text>
  <text class="s" x="40" y="80">横轴是 log10，纵向对不齐没关系：看的是数量级</text>
  <line x1="40" y1="102" x2="760" y2="102" stroke="#8a8a8a" opacity=".25"/>

  <text class="lab" x="40" y="176">一条都不用</text>
  <rect class="bar0" x="300" y="152" width="436" height="36" rx="3"/>
  <text class="val" x="748" y="176">69 864</text>

  <text class="lab" x="40" y="278">首根／末根失败就 return</text>
  <rect class="bar1" x="300" y="254" width="143" height="36" rx="3"/>
  <text class="val" x="456" y="278">39</text>

  <text class="lab" x="40" y="380">再加「长度相等就跳过」</text>
  <rect class="bar1" x="300" y="356" width="143" height="36" rx="3"/>
  <text class="val" x="456" y="380">39</text>

  <line class="axis" x1="300" y1="424" x2="756" y2="424"/>
  <line class="tick" x1="300" y1="424" x2="300" y2="434"/>
  <line class="tick" x1="390" y1="424" x2="390" y2="434"/>
  <line class="tick" x1="480" y1="424" x2="480" y2="434"/>
  <line class="tick" x1="570" y1="424" x2="570" y2="434"/>
  <line class="tick" x1="660" y1="424" x2="660" y2="434"/>
  <line class="tick" x1="750" y1="424" x2="750" y2="434"/>
  <text class="s" x="300" y="454" text-anchor="middle">10⁰</text>
  <text class="s" x="390" y="454" text-anchor="middle">10¹</text>
  <text class="s" x="480" y="454" text-anchor="middle">10²</text>
  <text class="s" x="570" y="454" text-anchor="middle">10³</text>
  <text class="s" x="660" y="454" text-anchor="middle">10⁴</text>
  <text class="s" x="750" y="454" text-anchor="middle">10⁵</text>

  <line x1="40" y1="492" x2="760" y2="492" stroke="#8a8a8a" opacity=".25"/>
  <text class="s" x="40" y="524">第三条在这组输入上没再省调用：前两条已经把这种</text>
  <text class="s" x="40" y="548">「第一根就填不满」的树砍干净了，轮不到它出手。</text>
</svg>
